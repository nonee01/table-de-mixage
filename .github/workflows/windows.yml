# Construit la table de mixage sous Windows, fait signer l'exe par SignPath (quand le projet y est accepté),
# publie le dossier « clé USB » en artefact, et en Release sur une étiquette v*.
name: Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# lecture seule par défaut ; seule la tâche release écrit (la Release)
permissions:
  contents: read
  actions: read # SignPath lit l'artefact non signé

jobs:
  windows:
    runs-on: windows-latest
    env:
      # renseignées dans Settings > Secrets and variables > Actions une fois le projet accepté par SignPath
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Tests du moteur
        run: cargo test -p moteur

      - name: Dossier clé USB
        shell: bash
        run: bash packaging/windows.sh

      - name: Exe non signé
        id: non-signe
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exe-non-signe
          path: dist/Table de mixage/table-de-mixage.exe

      - name: Signature SignPath
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: table-de-mixage
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.non-signe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signe

      - name: Remettre l'exe signé dans le dossier
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          cp dist/signe/table-de-mixage.exe "dist/Table de mixage/table-de-mixage.exe"
          rm -f dist/Table-de-mixage-windows.zip
          (cd dist && python -m zipfile -c Table-de-mixage-windows.zip "Table de mixage")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Table-de-mixage-windows
          path: dist/Table de mixage/

  # le chemin du professeur : construire.bat sur un Windows neuf (les outils C++ y sont déjà, Rust aussi)
  construire-bat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: construire.bat
        shell: cmd
        run: construire.bat /ci
      - name: Le dossier est complet
        shell: bash
        run: |
          cd "dist/Table de mixage"
          ls -la . piper voix | head -40
          test -f table-de-mixage.exe && test -f piper/piper.exe && test -f voix/fr_FR-siwis-medium.onnx
          echo "Bonjour, ceci est un test." | ./piper/piper.exe -m voix/fr_FR-siwis-medium.onnx -f test.wav
          test -s test.wav

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Table-de-mixage-windows
          path: Table de mixage
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m zipfile -c Table-de-mixage-windows.zip "Table de mixage"
          gh release create "$GITHUB_REF_NAME" Table-de-mixage-windows.zip --title "Table de mixage $GITHUB_REF_NAME" --notes-file packaging/LISEZMOI.txt
