[package]
name = "table-de-mixage"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "table-de-mixage"
path = "src/main.rs"

[dependencies]
moteur = { path = "../moteur" }
eframe = "0.37"
cpal = "0.18"
ringbuf = "0.6"
triple_buffer = "9"
egui_plot = "0.38"
realfft = "3.5"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "flac", "pcm"] }
rfd = "0.18"
hound = "3.5"

[dev-dependencies]
